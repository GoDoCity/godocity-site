<!DOCTYPE html>
<!--
  Netlify Forms detection file — DO NOT DELETE.

  Netlify scans /public at build time to register form schemas.
  This file guarantees both forms are indexed even if Astro's
  routing or SSG output changes.

  IMPORTANT: form name="" values here must exactly match the
  `form-name` field sent in every JS fetch() submission.
-->
<html lang="en">
<head><meta charset="utf-8" /><title>Forms</title></head>
<body>

  <!-- ── Newsletter signup form ── -->
  <form
    name="newsletter-signup"
    method="POST"
    action="/"
    data-netlify="true"
    netlify-honeypot="nl-bot"
  >
    <input type="hidden" name="form-name" value="newsletter-signup" />
    <input name="nl-bot" />
    <input name="email" type="email" />
    <button type="submit">Sign Up</button>
  </form>

</body>
</html>
