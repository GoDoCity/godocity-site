backend:
  name: github
  repo: GoDoCity/godocity-site
  branch: main
  auth_type: pkce
  client_id: Ov23lizuiLRTW8pIf2PO

media_folder: public/images
public_folder: /images

collections:
  - name: "pages"
    label: "Pages"
    folder: "content"
    create: true
    fields:
      - {name: "title", label: "Title", widget: "string"}
      - {name: "body", label: "Body", widget: "markdown"}
