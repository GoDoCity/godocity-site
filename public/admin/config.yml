# public/admin/config.yml
# Decap CMS — GoDoCity Multi-City Configuration
# Hard-reset version: 2-space indents, no duplicate field names.

backend:
  name: git-gateway
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:

  # 1. DAYTONA — NEWS & ARTICLES
  - name: "daytona-news"
    label: "Daytona - News"
    label_singular: "Article"
    folder: "src/content/posts/daytona"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}} - {{pubDate}}"
    media_folder: "/public/images/posts/daytona"
    public_folder: "/images/posts/daytona"
    fields:
      - label: "Headline"
        name: "title"
        widget: "string"
        hint: "Article headline. Keep under 80 characters."
      - label: "Standfirst"
        name: "description"
        widget: "text"
        required: "false"
        hint: "1-2 sentence summary shown below the headline."
      - label: "Publish Date"
        name: "pubDate"
        widget: "datetime"
        required: "false"
        date_format: "YYYY-MM-DD"
        time_format: "false"
      - label: "Author"
        name: "author"
        widget: "string"
        required: "false"
        default: "Charles King"
      - label: "Hero Image"
        name: "heroImage"
        widget: "image"
        required: "false"
        hint: "Min 1200px wide. Displays at 16:9."
      - label: "Category"
        name: "category"
        widget: "select"
        required: "false"
        options:
          - {label: "Sports", value: "Sports"}
          - {label: "Food & Drink", value: "Food & Drink"}
          - {label: "Events", value: "Events"}
          - {label: "Business", value: "Business"}
          - {label: "Real Estate", value: "Real Estate"}
          - {label: "Politics", value: "Politics"}
          - {label: "Community", value: "Community"}
          - {label: "Tourism", value: "Tourism"}
          - {label: "Arts & Culture", value: "Arts & Culture"}
          - {label: "Weather", value: "Weather"}
      - label: "Tags"
        name: "tags"
        widget: "list"
        required: "false"
        hint: "First tag used as category pill if Category is blank."
      - label: "City"
        name: "city"
        widget: "hidden"
        default: "daytona"
      - label: "Featured"
        name: "featured"
        widget: "boolean"
        required: "false"
        default: "false"
        hint: "ON = eligible for homepage hero slots."
      - label: "Body"
        name: "body"
        widget: "markdown"
        hint: "Full article body."

  # 2. DAYTONA — CITY GUIDES
  - name: "daytona-guides"
    label: "Daytona - City Guides"
    label_singular: "Guide"
    folder: "src/content/guides/daytona"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}}"
    media_folder: "/public/images/guides"
    public_folder: "/images/guides"
    fields:
      - label: "Guide Title"
        name: "title"
        widget: "string"
      - label: "Intro"
        name: "intro"
        widget: "text"
        required: "false"
        hint: "2-3 sentences shown in the guide hero."
      - label: "Category"
        name: "category"
        widget: "select"
        required: "false"
        default: "City Guide"
        options:
          - {label: "Food & Drink", value: "Food & Drink"}
          - {label: "Nightlife", value: "Nightlife"}
          - {label: "Shopping", value: "Shopping"}
          - {label: "Outdoors", value: "Outdoors"}
          - {label: "Arts & Culture", value: "Arts & Culture"}
          - {label: "Health & Wellness", value: "Health & Wellness"}
          - {label: "City Guide", value: "City Guide"}
      - label: "Author"
        name: "author"
        widget: "string"
        required: "false"
        default: "Charles King"
      - label: "Author Role"
        name: "role"
        widget: "string"
        required: "false"
        default: "Newsletter Editor"
      - label: "Publish Date"
        name: "pubDate"
        widget: "datetime"
        required: "false"
        date_format: "YYYY-MM-DD"
        time_format: "false"
      - label: "Hero Image"
        name: "heroImage"
        widget: "image"
        required: "false"
        hint: "Optional full-width banner."
      - label: "City"
        name: "city"
        widget: "hidden"
        default: "daytona"
      - label: "List Items (Ranked Spots)"
        name: "items"
        widget: "list"
        label_singular: "Spot"
        min: 1
        max: 20
        summary: "#{{fields.rank}} - {{fields.title}}"
        hint: "Add 1-10 spots. Sponsor card auto-injects between spots 3 and 4."
        fields:
          - label: "Rank"
            name: "rank"
            widget: "number"
            value_type: "int"
            min: 1
            max: 20
            hint: "1 = top of list."
          - label: "Tag / Type"
            name: "tag"
            widget: "string"
            required: "false"
            hint: "e.g. Fine Dining"
          - label: "Spot Name"
            name: "title"
            widget: "string"
            hint: "Keep under 60 characters."
          - label: "Description"
            name: "body"
            widget: "text"
            hint: "2-4 sentences. Be specific."
          - label: "Photo"
            name: "img"
            widget: "image"
            required: false
            hint: "Wide crop, min 800px."
            media_folder: "/public/images/guides/best"
            public_folder: "/images/guides/best"
          - label: "Photo Alt Text"
            name: "imgAlt"
            widget: "string"
            required: "false"
          - label: "Link URL"
            name: "href"
            widget: "string"
            required: "false"
            hint: "e.g. /daytona/food/ or https://restaurant.com"
      - label: "Local Sponsor (optional - overrides global)"
        name: "localSponsor"
        widget: "object"
        collapsed: true
        hint: "Fill this when you sell the slot to a local business. Leave blank for the global campaign."
        fields:
          - label: "Brand Name"
            name: "brand"
            widget: "string"
            required: "false"
          - label: "Tagline"
            name: "tagline"
            widget: "string"
            required: "false"
          - label: "Description"
            name: "body"
            widget: "text"
            required: "false"
            hint: "1-2 sentences inside the sponsor card."
          - label: "Logo"
            name: "logo"
            widget: "image"
            required: false
            media_folder: "/public/images/sponsors"
            public_folder: "/images/sponsors"
          - label: "Card Image"
            name: "img"
            widget: "image"
            required: false
            hint: "Portrait crop 3:4."
            media_folder: "/public/images/sponsors"
            public_folder: "/images/sponsors"
          - label: "Image Alt Text"
            name: "imgAlt"
            widget: "string"
            required: "false"
          - label: "CTA Button Text"
            name: "ctaText"
            widget: "string"
            required: "false"
            default: "Learn more"
          - label: "CTA Link URL"
            name: "ctaHref"
            widget: "string"
            required: "false"
      - label: "Editorial Note"
        name: "body"
        widget: "markdown"
        required: "false"
        hint: "Optional note below the list. Not required."

  # 3. GLOBAL SPONSORS
  - name: "global-sponsors"
    label: "Global Sponsors"
    label_singular: "Sponsor Campaign"
    folder: "src/content/globalSponsors"
    create: true
    delete: true
    slug: "{{brand | slugify}}"
    summary: "{{brand}} - {{tagline}} (Active: {{active}})"
    fields:
      - label: "Active"
        name: "active"
        widget: "boolean"
        default: true
        hint: "ON = running network-wide. OFF = paused everywhere instantly."
      - label: "Brand Name"
        name: "brand"
        widget: "string"
        hint: "e.g. Nike"
      - label: "Campaign Start Date"
        name: "pubDate"
        widget: "datetime"
        required: "false"
        date_format: "YYYY-MM-DD"
        time_format: "false"
        hint: "Most recent active date wins when multiple campaigns exist."
      - label: "Tagline"
        name: "tagline"
        widget: "string"
        hint: "Main headline in the sponsor card."
      - label: "Body Copy"
        name: "body"
        widget: "text"
        hint: "1-2 sentences. Renders at 14px."
      - label: "Logo"
        name: "logo"
        widget: "image"
        required: false
        hint: "Transparent PNG or SVG. 28px tall."
        media_folder: "/public/images/sponsors"
        public_folder: "/images/sponsors"
      - label: "Campaign Image"
        name: "img"
        widget: "image"
        required: false
        hint: "16:10 landscape. Min 800px wide."
        media_folder: "/public/images/sponsors"
        public_folder: "/images/sponsors"
      - label: "Image Alt Text"
        name: "imgAlt"
        widget: "string"
        required: "false"
      - label: "CTA Button Text"
        name: "ctaText"
        widget: "string"
        required: "false"
        default: "Learn more"
      - label: "CTA Link URL"
        name: "ctaHref"
        widget: "string"
        hint: "Full URL. Gets rel=noopener sponsored."
