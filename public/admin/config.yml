backend:
  name: github
  repo: GoDoCity/godocity-site
  branch: main
  base_url: https://sveltia-cms-auth.yellowcabking.workers.dev

media_folder: "public/images"
public_folder: "/images"

collections:

  - name: "daytona-news"
    label: "Daytona - News"
    label_singular: "Article"
    folder: "src/content/posts/daytona"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - {label: "Headline", name: "title", widget: "string"}
      - {label: "Publish Date", name: "pubDate", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false}
      - label: "Author"
        name: author
        widget: select
        required: false
        default: "Charles King"
        options:
          - {label: "Charles King",    value: "Charles King"}
          - {label: "Jax Sterling",    value: "Jax Sterling"}
          - {label: "Blair Archer",    value: "Blair Archer"}
          - {label: "Miles Vance",     value: "Miles Vance"}
          - {label: "Julian Wells",    value: "Julian Wells"}
          - {label: "Sloane Miles",    value: "Sloane Miles"}
          - {label: "Dr. JK Miller",   value: "Dr. JK Miller"}
          - {label: "Kit Prescott",    value: "Kit Prescott"}
          - {label: "Kit A. Marlow",   value: "Kit A. Marlow"}
          - {label: "Reese Montgomery",value: "Reese Montgomery"}
          - {label: "Deb Davis",       value: "Deb Davis"}
          - {label: "Logan King",      value: "Logan King"}
      - label: "Category"
        name: "category"
        widget: "select"
        required: false
        options:
          - {label: "Business", value: "Business"}
          - {label: "City", value: "City"}
          - {label: "Culture", value: "Culture"}
          - {label: "DIY", value: "DIY"}
          - {label: "Events", value: "Events"}
          - {label: "Food", value: "Food"}
          - {label: "History", value: "History"}
          - {label: "Real Estate", value: "Real Estate"}
          - {label: "Sports", value: "Sports"}
          - {label: "Travel & Outdoors", value: "Travel & Outdoors"}
          - {label: "Wellness", value: "Wellness"}
      - label: "Subtopic"
        name: "subtopic"
        widget: "select"
        required: false
        hint: "Sub-category — links to the topic's subtopic archive page."
        options:
          - {label: "Landmarks",     value: "Landmarks"}
          - {label: "Pioneers",      value: "Pioneers"}
          - {label: "Racing History", value: "Racing History"}
          - {label: "Archives",      value: "Archives"}
          - {label: "Architecture",  value: "Architecture"}
          - {label: "Dining",        value: "Dining"}
          - {label: "Bars",          value: "Bars"}
          - {label: "Coffee",        value: "Coffee"}
          - {label: "Fine Dining",   value: "Fine Dining"}
          - {label: "Casual",        value: "Casual"}
          - {label: "Breakfast",     value: "Breakfast"}
          - {label: "Fitness",       value: "Fitness"}
          - {label: "Health",        value: "Health"}
          - {label: "Spa",           value: "Spa"}
          - {label: "Mindfulness",   value: "Mindfulness"}
          - {label: "Yoga",          value: "Yoga"}
          - {label: "Nutrition",     value: "Nutrition"}
          - {label: "Clean",         value: "Clean"}
          - {label: "Paint",         value: "Paint"}
          - {label: "Repair",        value: "Repair"}
          - {label: "Decorate",      value: "Decorate"}
          - {label: "Build",         value: "Build"}
          - {label: "Craft",         value: "Craft"}
          - {label: "Recipe",        value: "Recipe"}
          - {label: "Shopping",      value: "Shopping"}
          - {label: "Family",        value: "Family"}
          - {label: "Holiday",       value: "Holiday"}
          - {label: "Weekend",       value: "Weekend"}
          - {label: "Hidden Gems",   value: "Hidden Gems"}
          - {label: "Outdoors",      value: "Outdoors"}
          - {label: "Festivals",     value: "Festivals"}
          - {label: "Arts",          value: "Arts"}
          - {label: "Nightlife",     value: "Nightlife"}
          - {label: "Music",         value: "Music"}
          - {label: "Theatre",       value: "Theatre"}
          - {label: "Development",   value: "Development"}
          - {label: "Openings",      value: "Openings"}
          - {label: "Tech",          value: "Tech"}
          - {label: "Small Business", value: "Small Business"}
          - {label: "Economy",       value: "Economy"}
          - {label: "Government",    value: "Government"}
          - {label: "Transport",     value: "Transport"}
          - {label: "Schools",       value: "Schools"}
          - {label: "Safety",        value: "Safety"}
          - {label: "Environment",   value: "Environment"}
          - {label: "Racing",        value: "Racing"}
          - {label: "High School",   value: "High School"}
          - {label: "Watersports",   value: "Watersports"}
          - {label: "Golf",          value: "Golf"}
          - {label: "Market News",   value: "Market News"}
          - {label: "Luxury",        value: "Luxury"}
          - {label: "Neighborhoods", value: "Neighborhoods"}
          - {label: "Rentals",       value: "Rentals"}
          - {label: "Staycations",   value: "Staycations"}
          - {label: "Day Trips",     value: "Day Trips"}
          - {label: "Beach Life",    value: "Beach Life"}
          - {label: "Boating",       value: "Boating"}
          - {label: "Wildlife",      value: "Wildlife"}
      - label: "Sponsorship Tier"
        name: "sponsorTier"
        widget: "select"
        required: false
        default: "None"
        options:
          - {label: "None (editorial)", value: "None"}
          - {label: "Featured", value: "Featured"}
          - {label: "Spotlight", value: "Spotlight"}
          - {label: "Partner Highlight", value: "Partner Highlight"}
          - {label: "Local Guide", value: "Local Guide"}
      - {label: "Tags", name: "tags", widget: "list", required: false}
      - {label: "Description", name: "description", widget: "text", required: false}
      - {label: "Thumbnail", name: "thumbnail", widget: "image", required: false, hint: "Small image for list views (optional). Falls back to Hero Image if not set."}
      - {label: "Hero Image", name: "heroImage", widget: "image", required: false}
      - {label: "City", name: "city", widget: "hidden", default: "daytona"}
      - {label: "Featured", name: "featured", widget: "boolean", required: false, default: false}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "daytona-events"
    label: "Daytona - Events"
    label_singular: "Event"
    folder: "src/content/events/daytona"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}} - {{eventDate}}"
    fields:
      - {label: "Event Name", name: "title", widget: "string"}
      - {label: "Event Date", name: "eventDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, hint: "Past events hide automatically."}
      - {label: "End Date", name: "endDate", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false, hint: "Multi-day events only."}
      - {label: "Location / Venue", name: "location", widget: "string", hint: "e.g. Daytona International Speedway"}
      - {label: "Address", name: "address", widget: "string", required: false}
      - {label: "City", name: "city", widget: "hidden", default: "daytona"}
      - label: "Category"
        name: "category"
        widget: "select"
        required: false
        options:
          - {label: "Sports", value: "Sports"}
          - {label: "Music", value: "Music"}
          - {label: "Food & Drink", value: "Food & Drink"}
          - {label: "Arts & Culture", value: "Arts & Culture"}
          - {label: "Community", value: "Community"}
          - {label: "Outdoors", value: "Outdoors"}
          - {label: "Family", value: "Family"}
          - {label: "Nightlife", value: "Nightlife"}
      - {label: "Short Description", name: "description", widget: "text", required: false}
      - {label: "Ticket / Info URL", name: "url", widget: "string", required: false, hint: "Leave blank to link to events page."}
      - {label: "Event Image", name: "image", widget: "image", required: false}
      - {label: "Featured", name: "featured", widget: "boolean", required: false, default: false, hint: "ON = pinned to top of events list."}
      - {label: "Sponsored Ad Slot", name: "isSponsored", widget: "boolean", required: false, default: false, hint: "ON = paid placement — GoDo Picks card shows the gold SPONSORED badge."}
      - {label: "Body", name: "body", widget: "markdown", required: false}

  - name: "diy-guides"
    label: "DIY Guides"
    label_singular: "DIY Guide"
    folder: "src/content/diy"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}} — {{cities}}"
    fields:
      - {label: "Title", name: "title", widget: "string", hint: "Clear, action-oriented headline (e.g. 'How to Hang Hurricane Shutters')."}
      - {label: "Intro", name: "intro", widget: "text", hint: "Minimum 2 paragraphs (separate with a blank line). Maximum 200 words. No markdown — plain text only."}
      - {label: "Materials", name: "materials", widget: "text", hint: "One item per line. Be specific — brand names, sizes, quantities help readers. Each line becomes a checkmark item automatically."}
      - {label: "Steps", name: "steps", widget: "text", hint: "One step per line. Write each as a full action sentence. Each line becomes a numbered yellow badge automatically."}
      - {label: "Community Note", name: "community_note", widget: "text", required: false, hint: "Optional expert tip, warning, or local insight. Rendered as a highlighted blockquote at the bottom of the main column."}
      - label: "Topic"
        name: "topic"
        widget: "select"
        hint: "Select the primary topic for this guide. Determines which topic feed the article appears in."
        options:
          - {label: "Clean", value: "Clean"}
          - {label: "Paint", value: "Paint"}
          - {label: "Repair", value: "Repair"}
          - {label: "Decorate", value: "Decorate"}
          - {label: "Craft", value: "Craft"}
          - {label: "Recipe", value: "Recipe"}
      - {label: "Publish Date", name: "pubDate", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false}
      - label: "Author"
        name: author
        widget: select
        required: false
        default: "Charles King"
        options:
          - {label: "Charles King",    value: "Charles King"}
          - {label: "Jax Sterling",    value: "Jax Sterling"}
          - {label: "Blair Archer",    value: "Blair Archer"}
          - {label: "Miles Vance",     value: "Miles Vance"}
          - {label: "Julian Wells",    value: "Julian Wells"}
          - {label: "Sloane Miles",    value: "Sloane Miles"}
          - {label: "Dr. JK Miller",   value: "Dr. JK Miller"}
          - {label: "Kit Prescott",    value: "Kit Prescott"}
          - {label: "Kit A. Marlow",   value: "Kit A. Marlow"}
          - {label: "Reese Montgomery",value: "Reese Montgomery"}
          - {label: "Deb Davis",       value: "Deb Davis"}
          - {label: "Logan King",      value: "Logan King"}
      - {label: "Hero Image", name: "heroImage", widget: "image", required: false, hint: "Optional banner image displayed above the title."}
      - {label: "Category", name: "category", widget: "hidden", default: "DIY"}

  - name: "guides"
    label: "Guides"
    folder: "src/content/guides/daytona"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - label: "Topic"
        name: "topic"
        widget: "select"
        hint: "Assigns the guide to one of the four hub sections."
        options:
          - {label: "COAST", value: "COAST"}
          - {label: "DRIVE", value: "DRIVE"}
          - {label: "SURF",  value: "SURF"}
          - {label: "LOCAL", value: "LOCAL"}
      - {label: "Featured", name: "featured", widget: "boolean", default: false, hint: "ON = appears in the Featured Hub at the top of /guides/."}
      - {label: "Show Table of Contents", name: "showToC", widget: "boolean", default: true}
      - {label: "Featured Image", name: "image", widget: "image"}
      - {label: "Description/Hook", name: "description", widget: "text"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - label: "Author"
        name: author
        widget: select
        required: false
        default: "Jax Sterling"
        options:
          - {label: "Jax Sterling",      value: "Jax Sterling"}
          - {label: "Charles King",      value: "Charles King"}
          - {label: "Blair Archer",      value: "Blair Archer"}
          - {label: "Miles Vance",       value: "Miles Vance"}
          - {label: "Julian Wells",      value: "Julian Wells"}
          - {label: "Sloane Miles",      value: "Sloane Miles"}
          - {label: "Dr. JK Miller",     value: "Dr. JK Miller"}
          - {label: "Kit Prescott",      value: "Kit Prescott"}
          - {label: "Kit A. Marlow",     value: "Kit A. Marlow"}
          - {label: "Reese Montgomery",  value: "Reese Montgomery"}
          - {label: "Deb Davis",         value: "Deb Davis"}
          - {label: "Logan King",        value: "Logan King"}
      - label: "Subtopic"
        name: "subtopic"
        widget: "select"
        required: false
        hint: "Sub-section this guide belongs to. Determines the deep-link pill on the article page."
        options:
          - {label: "Neighborhoods",    value: "Neighborhoods"}
          - {label: "Schools",          value: "Schools"}
          - {label: "Healthcare",       value: "Healthcare"}
          - {label: "Need to Know",     value: "Need to Know"}
          - {label: "Entrepreneurship", value: "Entrepreneurship"}
          - {label: "Industry",         value: "Industry"}
          - {label: "Networking",       value: "Networking"}
          - {label: "Coworking",        value: "Coworking"}
          - {label: "Outdoors",         value: "Outdoors"}
          - {label: "Arts & Culture",   value: "Arts & Culture"}
          - {label: "Dining",           value: "Dining"}
          - {label: "Attractions",      value: "Attractions"}
          - {label: "Basics & Pets",    value: "Basics & Pets"}
          - {label: "Health",           value: "Health"}
          - {label: "Home Services",    value: "Home Services"}
          - {label: "City & Safety",    value: "City & Safety"}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "topics"
    label: "Topic Boxes"
    label_singular: "Topic"
    folder: "src/content/topics"
    create: true
    delete: true
    slug: "{{city}}-{{slug}}"
    summary: "{{label}} ({{city}})"
    fields:
      - {label: "Label", name: "label", widget: "string", hint: "Display name shown on the tile (e.g. 'Business', 'Food')."}
      - {label: "Slug", name: "slug", widget: "string", hint: "URL-safe topic slug matching the city topic route (e.g. 'business', 'real-estate')."}
      - {label: "Image", name: "img", widget: "image", media_folder: "/public/images/topics", public_folder: "/images/topics", hint: "Background photo for the topic tile. Recommended: 800x600px, high contrast."}
      - label: "City"
        name: "city"
        widget: "select"
        default: "daytona"
        hint: "Which city site this topic tile belongs to."
        options:
          - {label: "Daytona Beach", value: "daytona"}
          - {label: "Orlando", value: "orlando"}
          - {label: "Jacksonville / 904", value: "904"}
      - {label: "Sort Order", name: "order", widget: "number", required: false, default: 0, hint: "Lower numbers appear first. Leave 0 for alphabetical."}

  - name: "global-sponsors"
    label: "Global Sponsors"
    label_singular: "Sponsor Campaign"
    folder: "src/content/globalSponsors"
    create: true
    delete: true
    slug: "{{brand}}-campaign"
    fields:
      - {label: "Active", name: "active", widget: "boolean", default: true, hint: "ON = running everywhere. OFF = paused instantly."}
      - {label: "Brand Name", name: "brand", widget: "string"}
      - {label: "Campaign Start Date", name: "pubDate", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false}
      - {label: "Tagline", name: "tagline", widget: "string"}
      - {label: "Body Copy", name: "body", widget: "text"}
      - {label: "Logo", name: "logo", widget: "image", required: false, media_folder: "/public/images/sponsors", public_folder: "/images/sponsors"}
      - {label: "Campaign Image", name: "img", widget: "image", required: false, media_folder: "/public/images/sponsors", public_folder: "/images/sponsors"}
      - {label: "Image Alt Text", name: "imgAlt", widget: "string", required: false}
      - {label: "CTA Button Text", name: "ctaText", widget: "string", required: false, default: "Learn more"}
      - {label: "CTA Link URL", name: "ctaHref", widget: "string"}

  - name: "journalists"
    label: "Journalists"
    label_singular: "Journalist"
    folder: "src/content/journalists"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - {label: "Name", name: "name", widget: "string"}
      - {label: "Photo", name: "photo", widget: "image", required: false}
      - {label: "Role / Title", name: "role", widget: "string", required: false, default: "Journalist", hint: "Displayed on the editorial team section (e.g. Newsletter Editor, Staff Writer)."}
      - {label: "Featured on Homepage", name: "featured", widget: "boolean", required: false, default: false, hint: "Show this journalist in the Editorial Team sidebar."}
      - {label: "Bio", name: "body", widget: "markdown"}

  - name: "ads"
    label: "Advertisements"
    label_singular: "Ad"
    folder: "src/content/ads"
    create: true
    delete: true
    slug: "{{title}}"
    summary: "{{title}} ({{fields.type}}) — {{fields.city}}"
    fields:
      - {label: "Campaign Name (Internal)", name: "title", widget: "string", hint: "Used as the UTM campaign slug. E.g. 'Spring Sale 2026'."}
      - label: "Ad Type / Placement"
        name: "type"
        widget: "select"
        hint: "Where this ad appears on the site."
        options:
          - {label: "Sidebar Ad", value: "sidebar"}
          - {label: "In-Feed Ad", value: "in-feed"}
          - {label: "Banner", value: "banner"}
          - {label: "Featured Event Spotlight", value: "featured-event"}
      - {label: "Active", name: "active", widget: "boolean", default: true, hint: "Toggle ON to run this ad network-wide. Toggle OFF to pause instantly."}
      - {label: "Event Date", name: "eventDate", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false, hint: "For Featured Event type only. Displays on the sidebar widget card."}
      - {label: "Ad Image / Creative", name: "image", widget: "image", required: false, media_folder: "/public/images/ads", public_folder: "/images/ads", hint: "Sidebar: 600×400px recommended. In-feed: 800×600px. Banner: 1200×300px."}
      - {label: "Destination URL", name: "link", widget: "string", hint: "Where the ad clicks through to. UTM params are appended automatically."}
      - label: "Target City"
        name: "city"
        widget: "select"
        required: false
        default: "all"
        hint: "Restrict to a single market, or choose 'All Markets' to run network-wide."
        options:
          - {label: "All Markets", value: "all"}
          - {label: "Daytona Beach", value: "daytona"}
          - {label: "Orlando", value: "orlando"}
          - {label: "Tampa", value: "tampa"}
      - {label: "Tagline (optional)", name: "tagline", widget: "string", required: false, hint: "Short descriptor shown below the image (max ~80 chars)."}
      - {label: "Alt Text", name: "altText", widget: "string", required: false, hint: "Screen reader description of the ad image."}
      - {label: "Notes", name: "body", widget: "text", required: false, hint: "Internal notes — flight dates, contact, etc. Not displayed on site."}
