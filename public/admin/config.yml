backend:
  name: github
  repo: GoDoCity/godocity-site
  branch: main
  auth_type: pkce
  app_id: Ov23lizuiLRTW8pIf2PO

media_folder: "public/images"
public_folder: "/images"

collections:

  - name: "daytona-news"
    label: "Daytona - News"
    label_singular: "Article"
    folder: "src/content/posts/daytona"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - {label: "Headline", name: "title", widget: "string"}
      - {label: "Publish Date", name: "pubDate", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false}
      - {label: "Author", name: "author", widget: "string", required: false, default: "Charles King"}
      - label: "Category"
        name: "category"
        widget: "select"
        required: false
        options:
          - {label: "Business", value: "Business"}
          - {label: "City", value: "City"}
          - {label: "Culture", value: "Culture"}
          - {label: "DIY", value: "DIY"}
          - {label: "Events", value: "Events"}
          - {label: "Food", value: "Food"}
          - {label: "History", value: "History"}
          - {label: "Real Estate", value: "Real Estate"}
          - {label: "Sports", value: "Sports"}
          - {label: "Travel & Outdoors", value: "Travel & Outdoors"}
          - {label: "Wellness", value: "Wellness"}
      - {label: "Subtopic", name: "subtopic", widget: "string", required: false, hint: "Short kicker label shown above the headline (e.g. 'Bars', 'Small Business', 'Development')."}
      - label: "Sponsorship Tier"
        name: "sponsorTier"
        widget: "select"
        required: false
        default: "None"
        options:
          - {label: "None (editorial)", value: "None"}
          - {label: "Featured", value: "Featured"}
          - {label: "Spotlight", value: "Spotlight"}
          - {label: "Partner Highlight", value: "Partner Highlight"}
          - {label: "Local Guide", value: "Local Guide"}
      - {label: "Tags", name: "tags", widget: "list", required: false}
      - {label: "Description", name: "description", widget: "text", required: false}
      - {label: "Thumbnail", name: "thumbnail", widget: "image", required: false, hint: "Small image for list views (optional). Falls back to Hero Image if not set."}
      - {label: "Hero Image", name: "heroImage", widget: "image", required: false}
      - {label: "City", name: "city", widget: "hidden", default: "daytona"}
      - {label: "Featured", name: "featured", widget: "boolean", required: false, default: false}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "daytona-events"
    label: "Daytona - Events"
    label_singular: "Event"
    folder: "src/content/events/daytona"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}} - {{eventDate}}"
    fields:
      - {label: "Event Name", name: "title", widget: "string"}
      - {label: "Event Date", name: "eventDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, hint: "Past events hide automatically."}
      - {label: "End Date", name: "endDate", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false, hint: "Multi-day events only."}
      - {label: "Location / Venue", name: "location", widget: "string", hint: "e.g. Daytona International Speedway"}
      - {label: "Address", name: "address", widget: "string", required: false}
      - {label: "City", name: "city", widget: "hidden", default: "daytona"}
      - label: "Category"
        name: "category"
        widget: "select"
        required: false
        options:
          - {label: "Sports", value: "Sports"}
          - {label: "Music", value: "Music"}
          - {label: "Food & Drink", value: "Food & Drink"}
          - {label: "Arts & Culture", value: "Arts & Culture"}
          - {label: "Community", value: "Community"}
          - {label: "Outdoors", value: "Outdoors"}
          - {label: "Family", value: "Family"}
          - {label: "Nightlife", value: "Nightlife"}
      - {label: "Short Description", name: "description", widget: "text", required: false}
      - {label: "Ticket / Info URL", name: "url", widget: "string", required: false, hint: "Leave blank to link to events page."}
      - {label: "Event Image", name: "image", widget: "image", required: false}
      - {label: "Featured", name: "featured", widget: "boolean", required: false, default: false, hint: "ON = pinned to top of events list."}
      - {label: "Body", name: "body", widget: "markdown", required: false}

  - name: "diy-guides"
    label: "DIY Guides"
    label_singular: "DIY Guide"
    folder: "src/content/diy"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}} — {{cities}}"
    fields:
      - {label: "Title", name: "title", widget: "string", hint: "Clear, action-oriented headline (e.g. 'How to Hang Hurricane Shutters')."}
      - label: "Intro"
        name: "intro"
        widget: "text"
        hint: "Minimum 2 paragraphs (separate with a blank line). Maximum 200 words. No markdown — plain text only."
      - label: "Materials"
        name: "materials"
        widget: "text"
        hint: "One item per line. Be specific — brand names, sizes, quantities help readers. Each line becomes a checkmark item automatically."
      - label: "Steps"
        name: "steps"
        widget: "text"
        hint: "One step per line. Write each as a full action sentence. Each line becomes a numbered yellow badge automatically."
      - label: "Community Note"
        name: "community_note"
        widget: "text"
        required: false
        hint: "Optional expert tip, warning, or local insight. Rendered as a highlighted blockquote at the bottom of the main column."
      - label: "Topic"
        name: "topic"
        widget: "select"
        hint: "Select the primary topic for this guide. Determines which topic feed the article appears in."
        options:
          - {label: "Clean", value: "Clean"}
          - {label: "Paint", value: "Paint"}
          - {label: "Repair", value: "Repair"}
          - {label: "Decorate", value: "Decorate"}
          - {label: "Build", value: "Build"}
          - {label: "Craft", value: "Craft"}
      - label: "Deploy to Cities"
        name: "cities"
        widget: "select"
        multiple: true
        min: 1
        hint: "Select every city site this guide should appear on."
        options:
          - {label: "Daytona Beach", value: "daytona"}
          - {label: "Orlando", value: "orlando"}
          - {label: "Jacksonville / 904", value: "904"}
      - {label: "Publish Date", name: "pubDate", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false}
      - {label: "Author", name: "author", widget: "string", required: false, default: "Charles King"}
      - {label: "Hero Image", name: "heroImage", widget: "image", required: false, hint: "Optional banner image displayed above the title."}
      - {label: "Category", name: "category", widget: "hidden", default: "DIY"}

  - name: "guides"
    label: "Guides"
    folder: "src/content/guides/daytona"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - label: "Topic"
        name: "topic"
        widget: "select"
        options:
          - {label: "Live", value: "Live"}
          - {label: "Work", value: "Work"}
          - {label: "Play", value: "Play"}
      - {label: "Featured", name: "featured", widget: "boolean", default: false}
      - {label: "Show Table of Contents", name: "showToC", widget: "boolean", default: true}
      - {label: "Featured Image", name: "image", widget: "image"}
      - {label: "Description/Hook", name: "description", widget: "text"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "topics"
    label: "Topic Boxes"
    label_singular: "Topic"
    folder: "src/content/topics"
    create: true
    delete: true
    slug: "{{city}}-{{slug}}"
    summary: "{{label}} ({{city}})"
    fields:
      - {label: "Label", name: "label", widget: "string", hint: "Display name shown on the tile (e.g. 'Business', 'Food')."}
      - {label: "Slug", name: "slug", widget: "string", hint: "URL-safe topic slug matching the city topic route (e.g. 'business', 'real-estate')."}
      - {label: "Image", name: "img", widget: "image", media_folder: "/public/images/topics", public_folder: "/images/topics", hint: "Background photo for the topic tile. Recommended: 800×600px, high contrast."}
      - label: "City"
        name: "city"
        widget: "select"
        default: "daytona"
        hint: "Which city site this topic tile belongs to."
        options:
          - {label: "Daytona Beach", value: "daytona"}
          - {label: "Orlando", value: "orlando"}
          - {label: "Jacksonville / 904", value: "904"}
      - {label: "Sort Order", name: "order", widget: "number", required: false, default: 0, hint: "Lower numbers appear first. Leave 0 for alphabetical."}

  - name: "global-sponsors"
    label: "Global Sponsors"
    label_singular: "Sponsor Campaign"
    folder: "src/content/globalSponsors"
    create: true
    delete: true
    slug: "{{brand}}-campaign"
    fields:
      - {label: "Active", name: "active", widget: "boolean", default: true, hint: "ON = running everywhere. OFF = paused instantly."}
      - {label: "Brand Name", name: "brand", widget: "string"}
      - {label: "Campaign Start Date", name: "pubDate", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false}
      - {label: "Tagline", name: "tagline", widget: "string"}
      - {label: "Body Copy", name: "body", widget: "text"}
      - {label: "Logo", name: "logo", widget: "image", required: false, media_folder: "/public/images/sponsors", public_folder: "/images/sponsors"}
      - {label: "Campaign Image", name: "img", widget: "image", required: false, media_folder: "/public/images/sponsors", public_folder: "/images/sponsors"}
      - {label: "Image Alt Text", name: "imgAlt", widget: "string", required: false}
      - {label: "CTA Button Text", name: "ctaText", widget: "string", required: false, default: "Learn more"}
      - {label: "CTA Link URL", name: "ctaHref", widget: "string"}
