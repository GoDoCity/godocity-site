backend:
  name: github
  repo: GoDoCity/godocity-site
  branch: main
  auth_type: implicit
  app_id: Ov23lizuiLRTW8pIf2PO

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:

  - name: "daytona-news"
    label: "Daytona - News"
    label_singular: "Article"
    folder: "src/content/posts/daytona"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - {label: "Headline", name: "title", widget: "string"}
      - {label: "Publish Date", name: "pubDate", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false}
      - {label: "Author", name: "author", widget: "string", required: false, default: "Charles King"}
      - label: "Category"
        name: "category"
        widget: "select"
        required: false
        options:
          - {label: "Business", value: "Business"}
          - {label: "City", value: "City"}
          - {label: "Culture", value: "Culture"}
          - {label: "DIY", value: "DIY"}
          - {label: "Events", value: "Events"}
          - {label: "Food", value: "Food"}
          - {label: "History", value: "History"}
          - {label: "Real Estate", value: "Real Estate"}
          - {label: "Sports", value: "Sports"}
          - {label: "Travel & Outdoors", value: "Travel & Outdoors"}
          - {label: "Wellness", value: "Wellness"}
      - {label: "Subtopic", name: "subtopic", widget: "string", required: false, hint: "Short kicker label shown above the headline (e.g. 'Bars', 'Small Business', 'Development')."}
      - {label: "Tags", name: "tags", widget: "list", required: false}
      - {label: "Description", name: "description", widget: "text", required: false}
      - {label: "Thumbnail", name: "thumbnail", widget: "image", required: false, hint: "Small image for list views (optional). Falls back to Hero Image if not set."}
      - {label: "Hero Image", name: "heroImage", widget: "image", required: false}
      - {label: "City", name: "city", widget: "hidden", default: "daytona"}
      - {label: "Featured", name: "featured", widget: "boolean", required: false, default: false}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "daytona-events"
    label: "Daytona - Events"
    label_singular: "Event"
    folder: "src/content/events/daytona"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}} - {{eventDate}}"
    fields:
      - {label: "Event Name", name: "title", widget: "string"}
      - {label: "Event Date", name: "eventDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, hint: "Past events hide automatically."}
      - {label: "End Date", name: "endDate", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false, hint: "Multi-day events only."}
      - {label: "Location / Venue", name: "location", widget: "string", hint: "e.g. Daytona International Speedway"}
      - {label: "Address", name: "address", widget: "string", required: false}
      - {label: "City", name: "city", widget: "hidden", default: "daytona"}
      - label: "Category"
        name: "category"
        widget: "select"
        required: false
        options:
          - {label: "Sports", value: "Sports"}
          - {label: "Music", value: "Music"}
          - {label: "Food & Drink", value: "Food & Drink"}
          - {label: "Arts & Culture", value: "Arts & Culture"}
          - {label: "Community", value: "Community"}
          - {label: "Outdoors", value: "Outdoors"}
          - {label: "Family", value: "Family"}
          - {label: "Nightlife", value: "Nightlife"}
      - {label: "Short Description", name: "description", widget: "text", required: false}
      - {label: "Ticket / Info URL", name: "url", widget: "string", required: false, hint: "Leave blank to link to events page."}
      - {label: "Event Image", name: "image", widget: "image", required: false}
      - {label: "Featured", name: "featured", widget: "boolean", required: false, default: false, hint: "ON = pinned to top of events list."}
      - {label: "Body", name: "body", widget: "markdown", required: false}

  - name: "global-sponsors"
    label: "Global Sponsors"
    label_singular: "Sponsor Campaign"
    folder: "src/content/globalSponsors"
    create: true
    delete: true
    slug: "{{brand}}-campaign"
    fields:
      - {label: "Active", name: "active", widget: "boolean", default: true, hint: "ON = running everywhere. OFF = paused instantly."}
      - {label: "Brand Name", name: "brand", widget: "string"}
      - {label: "Campaign Start Date", name: "pubDate", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false}
      - {label: "Tagline", name: "tagline", widget: "string"}
      - {label: "Body Copy", name: "body", widget: "text"}
      - {label: "Logo", name: "logo", widget: "image", required: false, media_folder: "/public/images/sponsors", public_folder: "/images/sponsors"}
      - {label: "Campaign Image", name: "img", widget: "image", required: false, media_folder: "/public/images/sponsors", public_folder: "/images/sponsors"}
      - {label: "Image Alt Text", name: "imgAlt", widget: "string", required: false}
      - {label: "CTA Button Text", name: "ctaText", widget: "string", required: false, default: "Learn more"}
      - {label: "CTA Link URL", name: "ctaHref", widget: "string"}
