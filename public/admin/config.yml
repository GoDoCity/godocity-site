# public/admin/config.yml
# SAFE MODE — News + Global Sponsors only.
# Add Guides collection back once login screen confirms CMS is loading.

backend:
  name: git-gateway
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:

  - name: "daytona-news"
    label: "Daytona - News"
    label_singular: "Article"
    folder: "src/content/posts/daytona"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - label: "Headline"
        name: "title"
        widget: "string"
      - label: "Standfirst"
        name: "description"
        widget: "text"
        required: false
      - label: "Publish Date"
        name: "pubDate"
        widget: "datetime"
        required: false
        date_format: "YYYY-MM-DD"
        time_format: false
      - label: "Author"
        name: "author"
        widget: "string"
        required: false
        default: "Charles King"
      - label: "Hero Image"
        name: "heroImage"
        widget: "image"
        required: false
      - label: "Category"
        name: "category"
        widget: "select"
        required: false
        options:
          - {label: "Sports", value: "Sports"}
          - {label: "Food & Drink", value: "Food & Drink"}
          - {label: "Events", value: "Events"}
          - {label: "Business", value: "Business"}
          - {label: "Real Estate", value: "Real Estate"}
          - {label: "Politics", value: "Politics"}
          - {label: "Community", value: "Community"}
          - {label: "Tourism", value: "Tourism"}
          - {label: "Arts & Culture", value: "Arts & Culture"}
          - {label: "Weather", value: "Weather"}
      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
      - label: "City"
        name: "city"
        widget: "hidden"
        default: "daytona"
      - label: "Featured"
        name: "featured"
        widget: "boolean"
        required: false
        default: false
      - label: "Body"
        name: "body"
        widget: "markdown"

  - name: "global-sponsors"
    label: "Global Sponsors"
    label_singular: "Sponsor Campaign"
    folder: "src/content/globalSponsors"
    create: true
    delete: true
    slug: "{{brand}}-campaign"
    fields:
      - label: "Active"
        name: "active"
        widget: "boolean"
        default: true
        hint: "ON = running everywhere. OFF = paused instantly."
      - label: "Brand Name"
        name: "brand"
        widget: "string"
      - label: "Campaign Start Date"
        name: "pubDate"
        widget: "datetime"
        required: false
        date_format: "YYYY-MM-DD"
        time_format: false
      - label: "Tagline"
        name: "tagline"
        widget: "string"
      - label: "Body Copy"
        name: "body"
        widget: "text"
      - label: "Logo"
        name: "logo"
        widget: "image"
        required: false
        media_folder: "/public/images/sponsors"
        public_folder: "/images/sponsors"
      - label: "Campaign Image"
        name: "img"
        widget: "image"
        required: false
        media_folder: "/public/images/sponsors"
        public_folder: "/images/sponsors"
      - label: "Image Alt Text"
        name: "imgAlt"
        widget: "string"
        required: false
      - label: "CTA Button Text"
        name: "ctaText"
        widget: "string"
        required: false
        default: "Learn more"
      - label: "CTA Link URL"
        name: "ctaHref"
        widget: "string"
