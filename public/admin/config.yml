  - name: "topics"
    label: "Topic Boxes"
    label_singular: "Topic"
    folder: "src/content/topics"
    create: true
    delete: true
    slug: "{{city}}-{{slug}}"
    summary: "{{label}} ({{city}})"
    fields:
      - {label: "Label", name: "label", widget: "string", hint: "Display name shown on the tile (e.g. 'Business', 'Food')."}
      - {label: "Slug", name: "slug", widget: "string", hint: "URL-safe topic slug matching the city topic route (e.g. 'business', 'real-estate')."}
      - {label: "Image", name: "img", widget: "image", media_folder: "/public/images/topics", public_folder: "/images/topics", hint: "Background photo for the topic tile. Recommended: 800x600px, high contrast."}
      - label: "City"
        name: "city"
        widget: "select"
        default: "daytona"
        hint: "Which city site this topic tile belongs to."
        options:
          - {label: "Daytona Beach", value: "daytona"}
          - {label: "Orlando", value: "orlando"}
          - {label: "Jacksonville / 904", value: "904"}
      - {label: "Sort Order", name: "order", widget: "number", required: false, default: 0, hint: "Lower numbers appear first. Leave 0 for alphabetical."}

  - name: "global-sponsors"
    label: "Global Sponsors"
    label_singular: "Sponsor Campaign"
    folder: "src/content/globalSponsors"
    create: true
    delete: true
    slug: "{{brand}}-campaign"
    fields:
      - {label: "Active", name: "active", widget: "boolean", default: true, hint: "ON = running everywhere. OFF = paused instantly."}
      - {label: "Brand Name", name: "brand", widget: "string"}
      - {label: "Campaign Start Date", name: "pubDate", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false}
      - {label: "Tagline", name: "tagline", widget: "string"}
      - {label: "Body Copy", name: "body", widget: "text"}
      - {label: "Logo", name: "logo", widget: "image", required: false, media_folder: "/public/images/sponsors", public_folder: "/images/sponsors"}
      - {label: "Campaign Image", name: "img", widget: "image", required: false, media_folder: "/public/images/sponsors", public_folder: "/images/sponsors"}
      - {label: "Image Alt Text", name: "imgAlt", widget: "string", required: false}
      - {label: "CTA Button Text", name: "ctaText", widget: "string", required: false, default: "Learn more"}
      - {label: "CTA Link URL", name: "ctaHref", widget: "string"}

  - name: "journalists"
    label: "Journalists"
    label_singular: "Journalist"
    folder: "src/content/journalists"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - {label: "Name", name: "name", widget: "string"}
      - {label: "Photo", name: "photo", widget: "image", required: false}
      - {label: "Role / Title", name: "role", widget: "string", required: false, default: "Journalist", hint: "Displayed on the editorial team section (e.g. Newsletter Editor, Staff Writer)."}
      - {label: "Featured on Homepage", name: "featured", widget: "boolean", required: false, default: false, hint: "Show this journalist in the Editorial Team sidebar."}
      - {label: "Bio", name: "body", widget: "markdown"}

  - name: "ads"
    label: "Advertisements"
    label_singular: "Ad"
    folder: "src/content/ads"
    create: true
    delete: true
    slug: "{{title}}"
    summary: "{{title}} ({{fields.type}}) — {{fields.city}}"
    fields:
      - {label: "Campaign Name (Internal)", name: "title", widget: "string", hint: "Used as the UTM campaign slug. E.g. 'Spring Sale 2026'."}
      - label: "Ad Type / Placement"
        name: "type"
        widget: "select"
        hint: "Where this ad appears on the site."
        options:
          - {label: "Sidebar Ad", value: "sidebar"}
          - {label: "In-Feed Ad", value: "in-feed"}
          - {label: "Banner", value: "banner"}
          - {label: "Guides Hub Strip", value: "guides-strip"}
          - {label: "Featured Event Spotlight", value: "featured-event"}
      - {label: "Active", name: "active", widget: "boolean", default: true, hint: "Toggle ON to run this ad network-wide. Toggle OFF to pause instantly."}
      - {label: "Event Date", name: "eventDate", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false, hint: "For Featured Event type only. Displays on the sidebar widget card."}
      - {label: "Ad Image / Creative", name: "image", widget: "image", required: false, media_folder: "/public/images/ads", public_folder: "/images/ads", hint: "Sidebar: 600×400px recommended. In-feed: 800×600px. Banner: 1200×300px. Guides Hub Strip: 800×600px — fills one of the 3 slots below the Guides hero (replaces a rate card)."}
      - {label: "Destination URL", name: "link", widget: "string", hint: "Where the ad clicks through to. UTM params are appended automatically."}
      - label: "Target City"
        name: "city"
        widget: "select"
        required: false
        default: "all"
        hint: "Restrict to a single market, or choose 'All Markets' to run network-wide."
        options:
          - {label: "All Markets", value: "all"}
          - {label: "Daytona Beach", value: "daytona"}
          - {label: "Orlando", value: "orlando"}
          - {label: "Tampa", value: "tampa"}
      - {label: "Tagline (optional)", name: "tagline", widget: "string", required: false, hint: "Short descriptor shown below the image (max ~80 chars)."}
      - {label: "Alt Text", name: "altText", widget: "string", required: false, hint: "Screen reader description of the ad image."}
      - {label: "Notes", name: "body", widget: "text", required: false, hint: "Internal notes — flight dates, contact, etc. Not displayed on site."}
