<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>GoDoCity CMS</title>
  </head>
  <body>
    <div id="nc-root"></div>
    <script src="https://unpkg.com/decap-cms@3.3.3/dist/decap-cms.js"></script>
    <script>
      // Explicit init — tells Decap exactly where the config lives.
      // Avoids race conditions from defer and path-guessing failures.
      CMS.init({
        config: {
          load_config_file: true,
          config_file: '/admin/config.yml'
        }
      });
    </script>
  </body>
</html>
