<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GoDoCity CMS</title>
  </head>
  <body>
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/decap-cms@3.3.3/dist/decap-cms.js"></script>
    <script>
      CMS.init({
        config: {
          backend: {
            name: "github",
            repo: "GoDoCity/godocity-site",
            branch: "main",
            auth_type: "pkce",
            app_id: "0v23lizuiLRTw8PiF2P0"
          },
          // This prevents Netlify from taking over
          local_backend: false, 
          publish_mode: "editorial_workflow"
        }
      });
      console.log("CMS force-initialized for GitHub.");
    </script>
  </body>
</html>
