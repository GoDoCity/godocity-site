[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "20"

# Clean alias for the event-submission function
[[redirects]]
  from   = "/api/submit-event"
  to     = "/.netlify/functions/submit-event"
  status = 200
  force  = true

# Redirect /submit-success/ to its static page
[[redirects]]
  from   = "/submit-success/"
  to     = "/submit-success/index.html"
  status = 200
  force  = false

# SPA fallback — keep trailing-slash routing working
[[redirects]]
  from   = "/*"
  to     = "/404/index.html"
  status = 404
