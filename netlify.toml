[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "20"

# Static-bypass workaround for Netlify 405: POST to /ping.txt is rewritten
# to the serverless function before Netlify's form-bot can intercept it.
[[redirects]]
  from   = "/ping.txt"
  to     = "/.netlify/functions/submit-event"
  status = 200
  force  = true

# Convenience alias kept for direct API calls / future use
[[redirects]]
  from   = "/api/submit-event"
  to     = "/.netlify/functions/submit-event"
  status = 200
  force  = true

# Redirect /submit-success/ to its static page
[[redirects]]
  from   = "/submit-success/"
  to     = "/submit-success/index.html"
  status = 200
  force  = false

# SPA fallback — keep trailing-slash routing working
[[redirects]]
  from   = "/*"
  to     = "/404/index.html"
  status = 404
